version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart_resume_postgres
    restart: always
    environment:
      POSTGRES_DB: smart_resume_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smart_resume_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: smart_resume_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:password123@postgres:5432/smart_resume_tracker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: smart_resume_tracker
      DB_USER: postgres
      DB_PASSWORD: password123
      JWT_SECRET: production_super_secret_jwt_key_2026_secure
      REDIS_URL: redis://redis:6379
      STORAGE_PROVIDER: local
      FRONTEND_URL: http://localhost:3000
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: smart_resume_frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
